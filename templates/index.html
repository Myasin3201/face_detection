<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تشخیص چهره | Face Detection (Browser-only)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.19.2/ort.min.js"></script>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: Tahoma, Arial, sans-serif;
        background: #f2f4f7;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #222;
    }

    .container {
        background: #ffffff;
        max-width: 640px;
        width: 100%;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        text-align: center;
    }

    h1 { font-size: 22px; margin-bottom: 8px; }
    p.subtitle { color: #666; margin-top: 0; margin-bottom: 25px; font-size: 14px; }

    .upload-box {
        border: 2px dashed #9aa5b1;
        border-radius: 12px;
        padding: 30px 15px;
        cursor: pointer;
        transition: 0.2s;
        background: #fafbfc;
    }
    .upload-box:hover { border-color: #4a90e2; background: #f0f6ff; }
    .upload-box p { margin: 8px 0 0 0; color: #555; font-size: 14px; }

    #fileInput { display: none; }

    canvas {
        max-width: 100%;
        border-radius: 10px;
        margin-top: 15px;
        display: none;
    }

    .conf-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 18px;
        font-size: 13px;
        color: #444;
    }
    .conf-row input[type="range"] { flex: 1; }

    button#detectBtn {
        margin-top: 20px;
        padding: 12px 28px;
        background: #4a90e2;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        display: none;
        transition: 0.2s;
    }
    button#detectBtn:hover { background: #3576c4; }
    button#detectBtn:disabled { background: #a9c6ea; cursor: not-allowed; }

    #status { margin-top: 15px; font-size: 14px; color: #444; min-height: 20px; }

    .result-box {
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #eee;
        display: none;
    }
    .face-count { font-weight: bold; color: #2e7d32; margin-bottom: 10px; font-size: 15px; }
    .error-text { color: #c0392b; }
    .note { font-size: 12px; color: #999; margin-top: 20px; }
</style>
</head>
<body>

<div class="container">
    <h1>🔍 سامانه تشخیص چهره (کاملاً مرورگری)</h1>
    <p class="subtitle">یک تصویر آپلود کنید — همه‌چیز داخل همین مرورگر شما اجرا می‌شود، بدون سرور</p>

    <div class="upload-box" id="uploadBox">
        <p>📁 برای انتخاب عکس کلیک کنید</p>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="conf-row">
        <span>آستانه اطمینان:</span>
        <input type="range" id="confSlider" min="0.1" max="0.9" step="0.05" value="0.5">
        <span id="confValue">0.50</span>
    </div>

    <button id="detectBtn">تشخیص چهره</button>

    <div id="status"></div>

    <div class="result-box" id="resultBox">
        <div class="face-count" id="faceCount"></div>
        <canvas id="resultCanvas"></canvas>
    </div>

    <p class="note">مدل: best.onnx — اولین اجرا کمی طول می‌کشد چون مدل باید دانلود و در مرورگر بارگذاری شود.</p>
</div>

<script>
// ---------------------------------------------------------
// تنظیمات
// ---------------------------------------------------------
const MODEL_PATH = "best.onnx";   // فایل مدل باید کنار این فایل قرار بگیرد
const MODEL_INPUT_SIZE = 640;     // اندازه ورودی که هنگام export با imgsz=640 استفاده شد
const IOU_THRESHOLD = 0.45;

let session = null;
let selectedImage = null; // HTMLImageElement

const uploadBox   = document.getElementById("uploadBox");
const fileInput   = document.getElementById("fileInput");
const detectBtn   = document.getElementById("detectBtn");
const statusEl    = document.getElementById("status");
const resultBox   = document.getElementById("resultBox");
const canvas      = document.getElementById("resultCanvas");
const faceCountEl = document.getElementById("faceCount");
const confSlider  = document.getElementById("confSlider");
const confValue   = document.getElementById("confValue");

confSlider.addEventListener("input", () => {
    confValue.textContent = parseFloat(confSlider.value).toFixed(2);
});

// ---------------------------------------------------------
// بارگذاری مدل ONNX (فقط یک بار، هنگام اولین استفاده)
// ---------------------------------------------------------
async function loadModel() {
    if (session) return session;
    statusEl.textContent = "⏳ در حال دانلود و بارگذاری مدل...";
    session = await ort.InferenceSession.create(MODEL_PATH, {
        executionProviders: ["wasm"]
    });
    statusEl.textContent = "✅ مدل آماده است";
    return session;
}

// ---------------------------------------------------------
// انتخاب فایل
// ---------------------------------------------------------
uploadBox.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            selectedImage = img;
            detectBtn.style.display = "inline-block";
            statusEl.textContent = "";
            resultBox.style.display = "none";
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
});

// ---------------------------------------------------------
// پیش‌پردازش: letterbox resize به 640x640 + نرمال‌سازی + CHW
// ---------------------------------------------------------
function preprocess(img) {
    const size = MODEL_INPUT_SIZE;
    const scale = Math.min(size / img.width, size / img.height);
    const newW = Math.round(img.width * scale);
    const newH = Math.round(img.height * scale);
    const padX = Math.floor((size - newW) / 2);
    const padY = Math.floor((size - newH) / 2);

    const off = document.createElement("canvas");
    off.width = size;
    off.height = size;
    const ctx = off.getContext("2d");
    ctx.fillStyle = "rgb(114,114,114)"; // پدینگ خاکستری استاندارد YOLO
    ctx.fillRect(0, 0, size, size);
    ctx.drawImage(img, padX, padY, newW, newH);

    const imageData = ctx.getImageData(0, 0, size, size).data;
    const chw = new Float32Array(3 * size * size);
    for (let i = 0; i < size * size; i++) {
        chw[i] = imageData[i * 4] / 255;                     // R
        chw[size * size + i] = imageData[i * 4 + 1] / 255;    // G
        chw[2 * size * size + i] = imageData[i * 4 + 2] / 255; // B
    }

    return {
        tensor: new ort.Tensor("float32", chw, [1, 3, size, size]),
        scale, padX, padY
    };
}

// ---------------------------------------------------------
// Non-Max Suppression
// ---------------------------------------------------------
function iou(a, b) {
    const x1 = Math.max(a.x1, b.x1);
    const y1 = Math.max(a.y1, b.y1);
    const x2 = Math.min(a.x2, b.x2);
    const y2 = Math.min(a.y2, b.y2);
    const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
    const areaA = (a.x2 - a.x1) * (a.y2 - a.y1);
    const areaB = (b.x2 - b.x1) * (b.y2 - b.y1);
    return inter / (areaA + areaB - inter);
}

function nms(boxes, iouThreshold) {
    boxes.sort((a, b) => b.score - a.score);
    const kept = [];
    for (const box of boxes) {
        let overlap = false;
        for (const k of kept) {
            if (iou(box, k) > iouThreshold) { overlap = true; break; }
        }
        if (!overlap) kept.push(box);
    }
    return kept;
}

// ---------------------------------------------------------
// پس‌پردازش خروجی مدل YOLO (فرمت [1, 4+nc, num_boxes])
// ---------------------------------------------------------
function postprocess(output, confThreshold, meta, origW, origH) {
    const data = output.data;
    const dims = output.dims; // [1, 4+nc, N]
    const numFeatures = dims[1];
    const numBoxes = dims[2];
    const numClasses = numFeatures - 4;

    const boxes = [];
    for (let i = 0; i < numBoxes; i++) {
        // پیدا کردن بالاترین امتیاز کلاس برای این باکس
        let bestScore = -1;
        for (let c = 0; c < numClasses; c++) {
            const score = data[(4 + c) * numBoxes + i];
            if (score > bestScore) bestScore = score;
        }
        if (bestScore < confThreshold) continue;

        const cx = data[0 * numBoxes + i];
        const cy = data[1 * numBoxes + i];
        const w  = data[2 * numBoxes + i];
        const h  = data[3 * numBoxes + i];

        // مختصات روی تصویر 640x640 با پدینگ
        let x1 = cx - w / 2;
        let y1 = cy - h / 2;
        let x2 = cx + w / 2;
        let y2 = cy + h / 2;

        // حذف پدینگ و برگرداندن به مقیاس تصویر اصلی
        x1 = (x1 - meta.padX) / meta.scale;
        y1 = (y1 - meta.padY) / meta.scale;
        x2 = (x2 - meta.padX) / meta.scale;
        y2 = (y2 - meta.padY) / meta.scale;

        x1 = Math.max(0, Math.min(origW, x1));
        y1 = Math.max(0, Math.min(origH, y1));
        x2 = Math.max(0, Math.min(origW, x2));
        y2 = Math.max(0, Math.min(origH, y2));

        boxes.push({ x1, y1, x2, y2, score: bestScore });
    }

    return nms(boxes, IOU_THRESHOLD);
}

// ---------------------------------------------------------
// اجرای کامل تشخیص
// ---------------------------------------------------------
detectBtn.addEventListener("click", async () => {
    if (!selectedImage) return;

    detectBtn.disabled = true;
    try {
        await loadModel();
        statusEl.textContent = "⏳ در حال پردازش تصویر...";

        const { tensor, scale, padX, padY } = preprocess(selectedImage);
        const feeds = {};
        feeds[session.inputNames[0]] = tensor;

        const results = await session.run(feeds);
        const output = results[session.outputNames[0]];

        const confThreshold = parseFloat(confSlider.value);
        const boxes = postprocess(
            output, confThreshold,
            { scale, padX, padY },
            selectedImage.width, selectedImage.height
        );

        // رسم روی canvas
        canvas.width = selectedImage.width;
        canvas.height = selectedImage.height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(selectedImage, 0, 0);
        ctx.strokeStyle = "green";
        ctx.lineWidth = 6;
        for (const b of boxes) {
            ctx.strokeRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
        }
        canvas.style.display = "block";

        faceCountEl.textContent = `تعداد چهره‌های تشخیص‌داده‌شده: ${boxes.length}`;
        resultBox.style.display = "block";
        statusEl.textContent = "✅ پردازش با موفقیت انجام شد";

    } catch (err) {
        statusEl.textContent = "❌ خطا: " + err.message;
        statusEl.classList.add("error-text");
        console.error(err);
    } finally {
        detectBtn.disabled = false;
    }
});
</script>

</body>
</html>
